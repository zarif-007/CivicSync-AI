name: Frontend CI

on:
  push:
    branches: ["main", "improve/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run data and triage tests
        run: npm test
      - name: Build production bundle
        run: npm run build
